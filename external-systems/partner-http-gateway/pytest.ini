[pytest]
# Pytest configuration for gateway tests

testpaths = gateway_tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts =
    --verbose
    --tb=short
    --strict-markers
    --cov=gateway
    --cov-report=term-missing:skip-covered
    --cov-report=html

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require external services)
    e2e: End-to-end tests (require full system running)
    whisper: Tests that require Whisper model (slow, requires GPU/CPU)

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::ImportWarning