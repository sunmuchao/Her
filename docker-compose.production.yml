# Her 生产级部署堆栈（安全隔离 + 网络分层）
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#   scripts/generate_secrets.sh  # 先生成密钥

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    networks:
      - data_net
    volumes:
      - her_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    # 不暴露端口，仅内网访问

  bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile.her
    env_file:
      - .env.example
      - .env
    environment:
      HER_E2E_MYSQL_HOST: mysql
      HER_E2E_MYSQL_PORT: "3306"
      HER_RELATION_LEDGER_DB: mysql://root@mysql:3306/her_relationship_ledger
      PARTNER_RECOMMENDATION_DB: mysql://root@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root@mysql:3306/her_discovery
      HER_DISCOVERY_PROFILE_SOURCE: mysql://root@mysql:3306/her?table=profiles
      PERSONA_MEMORY_MYSQL_SOURCE: mysql://root@mysql:3306/her?table=profiles
      HER_PROFILE_SOURCE_DSN: mysql://root@mysql:3306/her?table=profiles
      HER_PROXY_INTRO_STORAGE: matchmaking
      HER_RELATION_LEDGER_READ_MODE: ledger_primary
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    networks:
      - data_net
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "scripts/compose_bootstrap.py"]
    restart: "no"
    # 仅执行初始化任务，不重启

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - backend_net
      - data_net
    volumes:
      - her_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # 不暴露端口

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    networks:
      - data_net
    volumes:
      - her_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # 不暴露端口

  gateway-public:
    build:
      context: .
      dockerfile: docker/Dockerfile.her
    env_file:
      - .env.example
      - .env
    environment:
      PYTHONPATH: /app/external-systems/partner-http-gateway:/app/external-systems/partner-chat-system:/app/external-systems/partner-recommendation-system:/app/external-systems/partner-matchmaking-system:/app/external-systems/partner-discovery-system
      PARTNER_GATEWAY_SURFACE: public
      PARTNER_GATEWAY_ENABLE_JSONRPC: "0"
      PARTNER_HTTP_PORT: "8080"
      PARTNER_GATEWAY_DB_POOL_MAX: "16"
      HER_E2E_MYSQL_HOST: mysql
      HER_E2E_MYSQL_PORT: "3306"
      HER_RELATION_LEDGER_DB: mysql://root@mysql:3306/her_relationship_ledger
      PARTNER_RECOMMENDATION_DB: mysql://root@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root@mysql:3306/her_discovery
      HER_DISCOVERY_PROFILE_SOURCE: mysql://root@mysql:3306/her?table=profiles
      PERSONA_MEMORY_MYSQL_SOURCE: mysql://root@mysql:3306/her?table=profiles
      HER_PROFILE_SOURCE_DSN: mysql://root@mysql:3306/her?table=profiles
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      MINIO_BUCKET: her-media
      MINIO_SECURE: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SSE_SERVER_PUSH_URL: http://sse-server:8081/internal/push
      HER_AUTH_FIXED_CODE: "123456"
      HER_SMS_PROVIDER: shell
      HER_SMS_SHELL_COMMAND: /app/scripts/send_sms_stub.sh
      HER_SENSITIVE_DATA_KEY: SR5CbNWIROdXIfYXyjvIizIhvCHAUZ22b9URP7J99e0=
    secrets:
      - mysql_root_password
      - minio_root_user
      - minio_root_password
      - redis_password
    networks:
      - frontend_net
      - backend_net
      - data_net
    ports:
      - "8080:8080"  # 仅暴露公开端口
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: [
      "gunicorn",
      "--workers", "4",
      "--threads", "2",
      "--worker-class", "gthread",
      "--bind", "0.0.0.0:8080",
      "--timeout", "30",
      "--graceful-timeout", "10",
      "--keep-alive", "5",
      "--max-requests", "1000",
      "--max-requests-jitter", "100",
      "--access-logfile", "-",
      "--error-logfile", "-",
      "--log-level", "info",
      "gateway.app:application"
    ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  gateway-ops:
    build:
      context: .
      dockerfile: docker/Dockerfile.her
    env_file:
      - .env.example
      - .env
    environment:
      PYTHONPATH: /app/external-systems/partner-http-gateway:/app/external-systems/partner-chat-system:/app/external-systems/partner-recommendation-system:/app/external-systems/partner-matchmaking-system:/app/external-systems/partner-discovery-system
      PARTNER_GATEWAY_SURFACE: ops
      PARTNER_GATEWAY_ENABLE_JSONRPC: "0"
      PARTNER_GATEWAY_DB_POOL_MAX: "8"
      HER_E2E_MYSQL_HOST: mysql
      HER_E2E_MYSQL_PORT: "3306"
      HER_RELATION_LEDGER_DB: mysql://root@mysql:3306/her_relationship_ledger
      PARTNER_RECOMMENDATION_DB: mysql://root@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root@mysql:3306/her_discovery
      HER_DISCOVERY_PROFILE_SOURCE: mysql://root@mysql:3306/her?table=profiles
      PERSONA_MEMORY_MYSQL_SOURCE: mysql://root@mysql:3306/her?table=profiles
      HER_PROFILE_SOURCE_DSN: mysql://root@mysql:3306/her?table=profiles
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      MINIO_BUCKET: her-media
      MINIO_SECURE: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      PARTNER_HTTP_PORT: "8083"  # Gateway Ops 使用 8083 端口
    secrets:
      - mysql_root_password
      - minio_root_user
      - minio_root_password
      - redis_password
    networks:
      - frontend_net
      - backend_net
      - data_net
    ports:
      - "8083:8083"  # Gateway Ops 暴露 8083 端口
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: [
      "gunicorn",
      "--workers", "2",
      "--threads", "2",
      "--worker-class", "gthread",
      "--bind", "0.0.0.0:8083",
      "--timeout", "30",
      "--graceful-timeout", "10",
      "--keep-alive", "5",
      "--max-requests", "500",
      "--max-requests-jitter", "50",
      "--access-logfile", "-",
      "--error-logfile", "-",
      "--log-level", "info",
      "gateway.app:application"
    ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  gateway-internal:
    build:
      context: .
      dockerfile: docker/Dockerfile.her
    env_file:
      - .env.example
      - .env
    environment:
      PYTHONPATH: /app/external-systems/partner-http-gateway:/app/external-systems/partner-chat-system:/app/external-systems/partner-recommendation-system:/app/external-systems/partner-matchmaking-system:/app/external-systems/partner-discovery-system
      PARTNER_GATEWAY_SURFACE: internal
      PARTNER_GATEWAY_ENABLE_JSONRPC: "1"
      PARTNER_HTTP_PORT: "8080"
      PARTNER_GATEWAY_DB_POOL_MAX: "8"
      HER_E2E_MYSQL_HOST: mysql
      HER_E2E_MYSQL_PORT: "3306"
      HER_RELATION_LEDGER_DB: mysql://root@mysql:3306/her_relationship_ledger
      PARTNER_RECOMMENDATION_DB: mysql://root@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root@mysql:3306/her_discovery
      HER_DISCOVERY_PROFILE_SOURCE: mysql://root@mysql:3306/her?table=profiles
      PERSONA_MEMORY_MYSQL_SOURCE: mysql://root@mysql:3306/her?table=profiles
      HER_PROFILE_SOURCE_DSN: mysql://root@mysql:3306/her?table=profiles
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      MINIO_BUCKET: her-media
      MINIO_SECURE: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - mysql_root_password
      - minio_root_user
      - minio_root_password
      - redis_password
    networks:
      - backend_net
      - data_net
    # 不暴露端口，仅内网访问
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: [
      "gunicorn",
      "--workers", "2",
      "--threads", "2",
      "--worker-class", "gthread",
      "--bind", "0.0.0.0:8080",
      "--timeout", "30",
      "--graceful-timeout", "10",
      "--keep-alive", "5",
      "--max-requests", "500",
      "--max-requests-jitter", "50",
      "--access-logfile", "-",
      "--error-logfile", "-",
      "--log-level", "info",
      "gateway.app:application"
    ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  sse-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.her
    env_file:
      - .env.example
      - .env
    environment:
      PYTHONPATH: /app/external-systems/sse-server
      HER_E2E_MYSQL_HOST: mysql
      HER_E2E_MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SSE_SERVER_PORT: "8081"
    secrets:
      - redis_password
    networks:
      - backend_net
      - data_net
    # 不暴露端口，仅内网访问
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "sse_server", "--host", "0.0.0.0", "--port", "8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.her
    env_file:
      - .env.example
      - .env
    environment:
      HER_E2E_MYSQL_HOST: mysql
      HER_E2E_MYSQL_PORT: "3306"
      HER_RELATION_LEDGER_DB: mysql://root@mysql:3306/her_relationship_ledger
      PARTNER_RECOMMENDATION_DB: mysql://root@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root@mysql:3306/her_discovery
      HER_DISCOVERY_PROFILE_SOURCE: mysql://root@mysql:3306/her?table=profiles
      PERSONA_MEMORY_MYSQL_SOURCE: mysql://root@mysql:3306/her?table=profiles
      HER_PROFILE_SOURCE_DSN: mysql://root@mysql:3306/her?table=profiles
      HER_SCHED_RECOMMENDATION_DB: mysql://root@mysql:3306/her_recommendation
      HER_SCHED_MATCHMAKING_DB: mysql://root@mysql:3306/her_matchmaking
      HER_SCHED_CHAT_DB: mysql://root@mysql:3306/her_chat
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      GATEWAY_INTERNAL_URL: http://gateway-internal:8080/jsonrpc
    secrets:
      - mysql_root_password
    networks:
      - backend_net
      - data_net
    # 不暴露端口
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      gateway-internal:
        condition: service_healthy
    command: ["python", "-m", "task_scheduler", "--health-port", "9090", "run"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:9090/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  frontend:
    profiles: ["frontend"]
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./frontend/her-app:/app
    environment:
      GATEWAY_URL: http://gateway-public:8080
      NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: "false"
      NEXT_PUBLIC_USE_AUTH_STUB: "true"
    networks:
      - frontend_net
    ports:
      - "3000:3000"  # 仅暴露前端端口
    depends_on:
      - gateway-public
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - her_prometheus_data:/prometheus
    networks:
      - backend_net
    # 不暴露端口，仅内网访问（运维人员通过 VPN 访问 Grafana）
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - her_grafana_data:/var/lib/grafana
    networks:
      - frontend_net
      - backend_net
    # 不暴露端口，仅内网访问
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  frontend_net:
    driver: bridge
    internal: false  # 可访问外部网络

  backend_net:
    driver: bridge
    internal: false  # 内部服务网络

  data_net:
    driver: bridge
    internal: true  # 数据层网络，严格隔离，不可访问外部

volumes:
  her_mysql_data:
  her_redis_data:
  her_minio_data:
  her_prometheus_data:
  her_grafana_data:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
