name: tech-optimization-ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gateway-contract-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff (unused imports and variables)
        run: ruff check --select F401,F841 .
      - name: OpenAPI contract tests
        run: |
          python -m unittest external-systems/partner-http-gateway/gateway_tests/test_openapi_contract.py
          python -m unittest external-systems/partner-http-gateway/gateway_tests/test_surface_config.py
      - name: Core pytest (refactor gate subset)
        run: |
          python -m pytest \
            tests \
            external-systems/partner-http-gateway/gateway_tests \
            local-skills/partner-search/tests \
            local-skills/persona-memory-sync/tests \
            external-systems/partner-recommendation-system/tests \
            external-systems/partner-matchmaking-system/tests \
            external-systems/partner-discovery-system/tests \
            -q --tb=no
      - name: Production env validator (dry schema)
        run: |
          HER_PRODUCTION_MODE=1 \
          HER_RELATION_LEDGER_READ_MODE=ledger_primary \
          PARTNER_GATEWAY_SURFACE=public \
          PARTNER_GATEWAY_DB_POOL_MAX=16 \
          HER_PROXY_INTRO_STORAGE=matchmaking \
          HER_DISCOVERY_AGENT_API_KEY=test-key \
          HER_DISCOVERY_AGENT_BASE_URL=https://example.com/v1 \
          python scripts/validate_production_env.py
      - name: Tech optimization env (repo templates + defaults)
        run: python scripts/validate_tech_optimization_env.py
