name: persona-eval-gate

on:
  pull_request:
    paths:
      - "local-skills/persona-eval/**"
      - "external-systems/partner-chat-system/**"
      - "external-systems/partner-discovery-system/**"
      - "artifacts/persona-eval/**"
      - "scripts/persona_eval_regression_gate.py"
  push:
    branches: [main, master]

jobs:
  persona-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Persona-eval skill unit tests
        run: |
          python -m unittest discover -s local-skills/persona-eval/tests -p 'test_*.py'
      - name: Baseline metrics smoke
        run: python scripts/persona_eval_regression_gate.py --self-check
