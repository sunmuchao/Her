name: frontend-her-app

on:
  push:
    paths:
      - 'frontend/her-app/**'
      - '.github/workflows/frontend-her-app.yml'
      - 'scripts/ci_bootstrap_frontend_e2e.py'
      - 'external-systems/partner-http-gateway/**'
      - 'db_migrations/**'
      - 'match_domain/**'
      - 'relationship_ledger/**'
      - 'partner_search/**'
      - 'outer_system_mysql_schema.py'
  pull_request:
    paths:
      - 'frontend/her-app/**'
      - '.github/workflows/frontend-her-app.yml'
      - 'scripts/ci_bootstrap_frontend_e2e.py'
      - 'external-systems/partner-http-gateway/**'
      - 'db_migrations/**'
      - 'match_domain/**'
      - 'relationship_ledger/**'
      - 'partner_search/**'
      - 'outer_system_mysql_schema.py'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/her-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/her-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:unit
      - name: Build
        run: pnpm run build

  production-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/her-app
    env:
      NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: 'false'
      NEXT_PUBLIC_ENABLE_DEMO_NAV: 'false'
      NEXT_PUBLIC_USE_AUTH_STUB: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/her-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Assert production mock flags are disabled
        run: |
          test "$NEXT_PUBLIC_ALLOW_MOCK_FALLBACK" = "false"
          test "$NEXT_PUBLIC_ENABLE_DEMO_NAV" = "false"
          test "$NEXT_PUBLIC_USE_AUTH_STUB" = "false"
      - name: Production build
        run: pnpm run build

  mock-fallback-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/her-app
    env:
      NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: 'true'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/her-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start Next.js dev server
        run: |
          pnpm exec next dev --hostname 127.0.0.1 --port 3000 > /tmp/her-next-mock.log 2>&1 &
          echo $! > /tmp/her-next-mock.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/splash >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Next.js failed to start"
          tail -n 40 /tmp/her-next-mock.log || true
          exit 1
      - name: Mock banner regression
        run: pnpm run e2e:mock-banner
      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/her-next-mock.pid ]; then
            kill "$(cat /tmp/her-next-mock.pid)" 2>/dev/null || true
          fi

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: frontend/her-app
    env:
      HER_E2E_MYSQL_HOST: 127.0.0.1
      HER_E2E_MYSQL_PORT: '3307'
      NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: 'false'
      NEXT_PUBLIC_ENABLE_DEMO_NAV: 'true'
      NEXT_PUBLIC_USE_AUTH_STUB: 'false'
      NEXT_PUBLIC_E2E_GATEWAY_AUTH: 'true'
      NODE_ENV: production
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps for bootstrap and gateway
        run: pip install pymysql python-dotenv
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/her-app/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full-stack Playwright E2E (mock flags off)
        run: pnpm run e2e:her:ci
      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: her-e2e-logs
          path: /tmp/her-e2e-ci/
          if-no-files-found: ignore
