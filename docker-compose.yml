      PARTNER_RECOMMENDATION_DB: mysql://root:her_root_password@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root:her_root_password@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root:her_root_password@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root:her_root_password@mysql:3306/her_discovery
