# Her local one-command stack
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f bootstrap gateway-public frontend

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: "her_root_password"
    ports:
      - "3307:3306"
    volumes:
      - her_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pher_root_password"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile.her
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      HER_E2E_MYSQL_HOST: mysql
      HER_E2E_MYSQL_PORT: "3306"
      HER_RELATION_LEDGER_DB: mysql://root@mysql:3306/her_relationship_ledger
      PARTNER_RECOMMENDATION_DB: mysql://root@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root@mysql:3306/her_discovery
      HER_DISCOVERY_PROFILE_SOURCE: mysql://root@mysql:3306/her?table=profiles
      PERSONA_MEMORY_MYSQL_SOURCE: mysql://root@mysql:3306/her?table=profiles
      HER_PROFILE_SOURCE_DSN: mysql://root@mysql:3306/her?table=profiles
=======
      HER_E2E_MYSQL_PASSWORD: "her_root_password"
      HER_RELATION_LEDGER_DB: mysql://root:her_root_password@mysql:3306/her_relationship_ledger
      PARTNER_RECOMMENDATION_DB: mysql://root:her_root_password@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root:her_root_password@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root:her_root_password@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root:her_root_password@mysql:3306/her_discovery
      PERSONA_MEMORY_MYSQL_SOURCE: mysql://root:her_root_password@mysql:3306/her?table=profiles
      HER_PROFILE_SOURCE_DSN: mysql://root:her_root_password@mysql:3306/her?table=profiles
      HER_PROXY_INTRO_STORAGE: matchmaking
      HER_RELATION_LEDGER_READ_MODE: ledger_primary
      PARTNER_SEARCH_CACHE_TTL_SECONDS: "120"
      PARTNER_SEARCH_CACHE_MAX_ENTRIES: "256"
      PARTNER_SEARCH_SNAPSHOT_PERSIST: "1"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "scripts/compose_bootstrap.py"]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - her_redis_data:/data
=======
  gateway-public:
    build:
      context: .
      dockerfile: docker/Dockerfile.her
    env_file:
      - .env.example
    environment:
      PARTNER_GATEWAY_SURFACE: public
      PARTNER_GATEWAY_ENABLE_JSONRPC: "0"
      PARTNER_GATEWAY_DB_POOL_MAX: "16"
      HER_E2E_MYSQL_HOST: mysql
      HER_E2E_MYSQL_PORT: "3306"
      HER_E2E_MYSQL_PASSWORD: "her_root_password"
      HER_AUTH_FIXED_CODE: "123456"
      PARTNER_GATEWAY_STATIC_TOKENS_JSON: '{"token-user-a":{"actor_id":"user-a","roles":["end_user"]},"token-user-b":{"actor_id":"user-b","roles":["end_user"]}}'
      HER_RELATION_LEDGER_DB: mysql://root:her_root_password@mysql:3306/her_relationship_ledger
      PARTNER_RECOMMENDATION_DB: mysql://root:her_root_password@mysql:3306/her_recommendation
      PARTNER_MATCHMAKING_DB: mysql://root:her_root_password@mysql:3306/her_matchmaking
      PARTNER_CHAT_DB: mysql://root:her_root_password@mysql:3306/her_chat
      PARTNER_DISCOVERY_DB: mysql://root:her_root_password@mysql:3306/her_discovery
      PERSONA_MEMORY_MYSQL_SOURCE: mysql://root:her_root_password@mysql:3306/her?table=profiles
      HER_PROFILE_SOURCE_DSN: mysql://root:her_root_password@mysql:3306/her?table=profiles
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: her_minio_admin
