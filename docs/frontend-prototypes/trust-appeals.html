<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · 申诉中心</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="trust-appeals">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Trust Companion / Appeals</p>
          <h1 class="lede">申诉中心</h1>
          <p>申诉页从信任中心中抽出“当前申诉单”的处理状态，强调补充材料和联系支持，而不是把所有风险记录混在一起。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <a class="icon-btn" href="/demo/trust">←</a>
            <h2>申诉中心</h2>
            <span class="chip blue">审核中</span>
          </header>
          <div class="phone-scroll">
            <section class="card">
              <strong>账号限制申诉</strong>
              <p class="subtle mt-6">申诉对象：账号限制处理结果</p>
              <p class="mt-8">申诉原因：系统可能误判了当前账号行为，需补充人工核验材料。</p>
            </section>

            <section class="card">
              <h3 class="section-title">处理时间线</h3>
              <div class="timeline mt-12">
                <div class="timeline-item"><strong>2024-01-02</strong><span>已提交申诉</span></div>
                <div class="timeline-item"><strong>2024-01-03</strong><span>已收到补充材料</span></div>
                <div class="timeline-item"><strong>2024-01-04</strong><span>人工复核中</span></div>
              </div>
            </section>

            <section class="card">
              <h3 class="section-title">下一步建议</h3>
              <p class="mt-8">补充能证明当前账号真实使用状态的材料，例如近期自拍、登录记录说明或被误报原因。</p>
              <div class="button-row mt-12">
                <button class="btn" type="button">补充材料</button>
                <a class="btn secondary" href="/demo/me">联系支持</a>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
