<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · 见面反馈</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="chat-meeting-feedback">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Sketch 07 / Feedback</p>
          <h1 class="lede">见面反馈</h1>
          <p>见面反馈用结构化问题替代开放评价，核心是核对照片、资料和安全感受，避免评价变成情绪宣泄，同时为信任系统补充可信样本。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <h2>见面反馈</h2>
            <span class="chip blue">第 1/3 步</span>
          </header>
          <div class="phone-scroll">
            <section class="card">
              <p>请记录线下见面的客观情况，重点核对资料真实性和安全感受，不做情绪化评价。</p>
            </section>

            <section class="card">
              <h3 class="section-title">照片和本人是否基本一致？</h3>
              <div class="option-grid mt-12">
                <button class="option-card active" type="button" aria-pressed="true">一致</button>
                <button class="option-card warn" type="button" aria-pressed="false">部分一致</button>
                <button class="option-card danger" type="button" aria-pressed="false">明显不符</button>
              </div>
            </section>

            <section class="card">
              <h3 class="section-title">资料信息和现实情况是否一致？</h3>
              <div class="option-grid mt-12">
                <button class="option-card active" type="button" aria-pressed="true">基本一致</button>
                <button class="option-card warn" type="button" aria-pressed="false">仍需核实</button>
                <button class="option-card danger" type="button" aria-pressed="false">明显不实</button>
              </div>
            </section>

            <section class="card">
              <h3 class="section-title">这次见面是否有安全顾虑？</h3>
              <div class="option-grid mt-12">
                <button class="option-card active" type="button" aria-pressed="true">没有</button>
                <button class="option-card warn" type="button" aria-pressed="false">不确定</button>
                <button class="option-card danger" type="button" aria-pressed="false">有</button>
              </div>
            </section>

            <section class="card">
              <h3 class="section-title">补充说明（可选）</h3>
              <div class="composer multiline mt-8">
                <textarea rows="4" aria-label="见面补充说明">整体沟通自然，现实表现和资料基本一致，建议继续观察后推进。</textarea>
              </div>
            </section>

            <div class="button-row">
              <a class="btn secondary" href="/demo/chat">取消</a>
              <button class="btn" type="button">提交反馈</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
