<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her Prototype · 对话式发现页</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4ecdf;
        --bg-deep: #e8dcc5;
        --panel: rgba(255, 250, 244, 0.9);
        --panel-strong: rgba(255, 253, 249, 0.98);
        --ink: #18211f;
        --muted: #5f6d66;
        --line: rgba(24, 33, 31, 0.1);
        --accent: #0f766e;
        --accent-strong: #115e59;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --good: #1d7a46;
        --good-soft: rgba(29, 122, 70, 0.12);
        --warn: #9a6f1e;
        --warn-soft: rgba(154, 111, 30, 0.12);
        --rose: #b74d5f;
        --rose-soft: rgba(183, 77, 95, 0.12);
        --shadow: 0 28px 70px rgba(43, 37, 28, 0.14);
        font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.13), transparent 28%),
          radial-gradient(circle at 84% 12%, rgba(183, 77, 95, 0.1), transparent 22%),
          linear-gradient(180deg, #fbf6ef 0%, var(--bg) 54%, var(--bg-deep) 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(24, 33, 31, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(24, 33, 31, 0.035) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.34), transparent 82%);
      }

      .page {
        width: min(520px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 20px 0 30px;
      }

      .prototype-bar {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        margin: 0 0 14px;
        border-radius: 999px;
        background: rgba(255, 252, 248, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 8px 24px rgba(43, 37, 28, 0.08);
        color: var(--muted);
        font-size: 13px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0f766e, #115e59);
      }

      .shell {
        display: grid;
        gap: 16px;
      }

      .phone {
        position: static;
        min-height: auto;
        padding: 16px;
        border-radius: 40px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(245, 235, 222, 0.92)),
          rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .phone::before {
        content: "";
        display: block;
        width: 138px;
        height: 28px;
        margin: 0 auto 14px;
        border-radius: 999px;
        background: rgba(24, 33, 31, 0.08);
      }

      .app {
        overflow: hidden;
        border-radius: 30px;
        background: linear-gradient(180deg, rgba(255, 253, 248, 0.98), rgba(248, 241, 230, 0.98));
        border: 1px solid rgba(24, 33, 31, 0.06);
      }

      .topbar {
        padding: 18px 18px 14px;
        border-bottom: 1px solid rgba(24, 33, 31, 0.06);
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .header-left {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .agent-avatar,
      .user-avatar,
      .icon-btn,
      .criteria-chip,
      .suggestion-chip,
      .quick-pill,
      .nav-item,
      .status-pill,
      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .agent-avatar {
        width: 44px;
        height: 44px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: #f7faf9;
        font-size: 16px;
        font-weight: 800;
        box-shadow: 0 12px 28px rgba(15, 118, 110, 0.24);
      }

      .title h1,
      .support h2,
      .mini-panel h3 {
        font-family: "Iowan Old Style", "Noto Serif SC", "STSong", serif;
      }

      .title h1 {
        margin: 0;
        font-size: 27px;
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .title p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 14px;
        background: rgba(24, 33, 31, 0.06);
        color: var(--ink);
        font-size: 16px;
        cursor: pointer;
      }

      .summary-card,
      .search-box,
      .inline-note,
      .followup,
      .panel,
      .mini-panel,
      .config-panel,
      .result-card,
      .module,
      .field input,
      .field textarea {
        border: 1px solid rgba(24, 33, 31, 0.06);
      }

      .summary-card {
        margin-top: 14px;
        padding: 16px;
        border-radius: 22px;
        background:
          radial-gradient(circle at top right, rgba(183, 77, 95, 0.08), transparent 28%),
          linear-gradient(140deg, rgba(15, 118, 110, 0.12), rgba(255, 255, 255, 0.7));
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .summary-card strong,
      .search-box strong,
      .inline-note strong,
      .followup strong,
      .check strong,
      .module-title,
      .result-group-title,
      .config-panel h3 {
        display: block;
      }

      .summary-card strong {
        font-size: 18px;
        letter-spacing: -0.03em;
      }

      .summary-card p,
      .search-box p,
      .inline-note p,
      .followup p,
      .check span,
      .support p,
      .mini-panel ul,
      .helper-text {
        color: var(--muted);
        line-height: 1.7;
      }

      .summary-card p {
        margin: 8px 0 0;
        font-size: 13px;
      }

      .status-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .status-pill {
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.72);
        color: var(--ink);
      }

      .status-pill.phase {
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .status-pill.error {
        color: var(--rose);
        background: var(--rose-soft);
      }

      .search-state {
        padding: 14px 18px 8px;
      }

      .search-box {
        padding: 14px 16px;
        border-radius: 20px;
        background: rgba(24, 33, 31, 0.05);
      }

      .search-box strong {
        font-size: 14px;
      }

      .search-box p {
        margin: 6px 0 0;
        font-size: 12px;
      }

      .criteria-row,
      .suggestions,
      .quick-prompts,
      .photo-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .criteria-row::-webkit-scrollbar,
      .suggestions::-webkit-scrollbar,
      .quick-prompts::-webkit-scrollbar,
      .photo-strip::-webkit-scrollbar {
        display: none;
      }

      .criteria-row {
        padding: 0 18px 12px;
      }

      .criteria-chip,
      .quick-pill,
      .suggestion-chip {
        white-space: nowrap;
        padding: 9px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .criteria-chip {
        background: rgba(24, 33, 31, 0.06);
        color: var(--ink);
      }

      .criteria-chip.active {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .criteria-chip.empty,
      .quick-pill {
        color: var(--muted);
      }

      .quick-pill {
        border: 0;
        background: rgba(24, 33, 31, 0.06);
        cursor: pointer;
      }

      .dialogue {
        display: grid;
        gap: 14px;
        padding: 0 18px 16px;
      }

      .msg {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .msg.user {
        justify-content: flex-end;
      }

      .msg.assistant .user-avatar {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      }

      .user-avatar {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: linear-gradient(135deg, #cdb9a1, #8f7357);
        color: #f7faf9;
        font-size: 12px;
        font-weight: 800;
        flex: none;
      }

      .bubble {
        max-width: 84%;
        padding: 13px 14px;
        border-radius: 18px 18px 18px 6px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 10px 24px rgba(43, 37, 28, 0.06);
      }

      .msg.user .bubble {
        border-radius: 18px 18px 6px 18px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: #f7faf9;
      }

      .bubble strong {
        display: block;
        margin-bottom: 7px;
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .bubble p {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .inline-note,
      .followup {
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(24, 33, 31, 0.05);
      }

      .inline-note strong,
      .followup strong {
        margin-bottom: 8px;
        font-size: 13px;
      }

      .inline-note p,
      .followup p {
        margin: 0;
        font-size: 13px;
      }

      .empty-state {
        padding: 16px;
        border-radius: 20px;
        background: rgba(24, 33, 31, 0.05);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .result-group-title {
        margin: 0 0 10px;
        font-size: 15px;
        letter-spacing: -0.02em;
      }

      .result-stack {
        display: grid;
        gap: 14px;
      }

      .result-card {
        overflow: hidden;
        border-radius: 26px;
        background: var(--panel-strong);
        box-shadow: 0 18px 50px rgba(43, 37, 28, 0.09);
      }

      .result-cover {
        position: relative;
        min-height: 148px;
        padding: 16px;
        color: #f8faf9;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.22), transparent 16%),
          radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.14), transparent 16%),
          linear-gradient(145deg, #33534d 0%, #5d867d 52%, #cc9d7d 100%);
        background-size: cover;
        background-position: center;
      }

      .meta-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: #f8faf9;
        background: rgba(12, 18, 17, 0.38);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .result-top,
      .result-bottom,
      .person-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .result-top,
      .result-bottom {
        align-items: center;
      }

      .score {
        display: grid;
        justify-items: end;
      }

      .score small {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.78;
      }

      .score strong {
        font-size: 28px;
        line-height: 1;
        letter-spacing: -0.08em;
      }

      .result-body {
        padding: 16px;
      }

      .person-row {
        align-items: flex-start;
      }

      .person-row h2 {
        margin: 0;
        font-size: 25px;
        line-height: 1.1;
        letter-spacing: -0.05em;
        font-family: "Iowan Old Style", "Noto Serif SC", "STSong", serif;
      }

      .person-row p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .tag {
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .tag.good {
        color: var(--good);
        background: var(--good-soft);
      }

      .tag.warn {
        color: var(--warn);
        background: var(--warn-soft);
      }

      .tag.soft {
        color: var(--muted);
        background: rgba(24, 33, 31, 0.06);
      }

      .module {
        margin-top: 14px;
        padding: 14px;
        border-radius: 20px;
        background: rgba(24, 33, 31, 0.04);
      }

      .module-title {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .module p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .card-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        margin-top: 14px;
      }

      .btn,
      .config-actions button,
      .send-btn {
        appearance: none;
        border: 0;
        border-radius: 18px;
        padding: 13px 14px;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .btn.primary,
      .config-actions button.primary,
      .send-btn {
        color: #f7faf9;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      }

      .btn.secondary,
      .config-actions button.secondary {
        color: var(--ink);
        background: rgba(24, 33, 31, 0.08);
      }

      .btn:disabled,
      .config-actions button:disabled,
      .send-btn:disabled,
      .icon-btn:disabled,
      .quick-pill:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .suggestion-chip {
        border: 0;
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
        cursor: pointer;
      }

      .composer {
        position: sticky;
        bottom: 0;
        padding: 12px 18px 18px;
        background: linear-gradient(180deg, rgba(248, 241, 230, 0), rgba(248, 241, 230, 0.98) 34%);
      }

      .bottom-nav {
        display: none;
      }

      .quick-prompts {
        margin-bottom: 10px;
      }

      .composer-inner {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 76px;
        gap: 10px;
        align-items: center;
      }

      .input-shell {
        padding: 0;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(24, 33, 31, 0.06);
      }

      .compose-field {
        width: 100%;
        min-height: 54px;
        max-height: 140px;
        padding: 14px 16px;
        border: 0;
        resize: vertical;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }

      .compose-field:focus,
      .field input:focus,
      .field textarea:focus {
        outline: 2px solid rgba(15, 118, 110, 0.2);
        outline-offset: 0;
      }

      .bottom-nav {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        padding: 0 18px 18px;
      }

      .nav-item {
        flex-direction: column;
        gap: 6px;
        min-height: 58px;
        border-radius: 18px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        background: rgba(255, 255, 255, 0.58);
      }

      .nav-item strong {
        font-size: 16px;
      }

      .nav-item.active {
        color: #f7faf9;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        box-shadow: 0 12px 30px rgba(15, 118, 110, 0.22);
      }

      .support {
        display: grid;
        gap: 18px;
      }

      .panel,
      .mini-panel,
      .config-panel {
        padding: 24px;
        border-radius: 32px;
        background:
          linear-gradient(180deg, rgba(255, 252, 247, 0.95), rgba(247, 239, 227, 0.95)),
          rgba(255, 255, 255, 0.5);
        box-shadow: var(--shadow);
      }

      .support h2 {
        margin: 0;
        font-size: 34px;
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .checklist,
      .config-grid {
        display: grid;
        gap: 12px;
        margin-top: 22px;
      }

      .check {
        padding: 16px 18px;
        border-radius: 20px;
        background: rgba(24, 33, 31, 0.05);
      }

      .check strong {
        font-size: 16px;
      }

      .grid-panels {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .mini-panel h3,
      .config-panel h3 {
        margin: 0 0 10px;
        font-size: 24px;
        letter-spacing: -0.04em;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field span {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .field input,
      .field textarea {
        width: 100%;
        padding: 13px 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.84);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }

      .config-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .config-meta {
        margin-top: 14px;
        display: grid;
        gap: 6px;
      }

      .config-meta code {
        padding: 3px 7px;
        border-radius: 999px;
        background: rgba(24, 33, 31, 0.06);
        color: var(--ink);
      }

      .debug-shell {
        overflow: hidden;
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 252, 247, 0.95), rgba(247, 239, 227, 0.95)),
          rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(24, 33, 31, 0.06);
        box-shadow: var(--shadow);
      }

      .debug-summary {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 18px 20px;
        cursor: pointer;
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
        list-style: none;
      }

      .debug-summary::-webkit-details-marker {
        display: none;
      }

      .debug-hint {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .debug-content {
        padding: 0 20px 20px;
      }

      .debug-content .config-panel {
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
      }

      @media (max-width: 1040px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .phone {
          position: static;
          min-height: auto;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100vw - 16px, 520px);
          padding-top: 10px;
        }

        .prototype-bar {
          display: none;
        }

        .phone {
          padding: 10px;
          border-radius: 28px;
        }

        .app {
          border-radius: 24px;
        }

        .grid-panels,
        .config-actions,
        .card-actions {
          grid-template-columns: 1fr;
        }

        .panel,
        .mini-panel,
        .config-panel {
          padding: 20px;
          border-radius: 24px;
        }

        .debug-shell {
          padding: 0;
          border-radius: 24px;
        }

        .debug-content {
          padding: 0 0 4px;
        }

        .support h2 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="prototype-bar">
        <span class="dot"></span>
        <span>Live API prototype · 发现页直接联调 `/v1/discovery/...`</span>
      </div>

      <div class="shell">
        <section class="phone">
          <div class="app">
            <header class="topbar">
              <div class="row">
                <div class="header-left">
                  <div class="agent-avatar">红娘</div>
                  <div class="title">
                    <h1>先聊，再找合适的人</h1>
                    <p>你只要说要求，红娘会继续追问或给结果。</p>
                  </div>
                </div>
                <button class="icon-btn" id="refresh-icon-btn" type="button" aria-label="恢复当前会话">↻</button>
              </div>

              <section class="summary-card">
                <p class="eyebrow">AI 红娘</p>
                <strong id="summary-headline">正在连接发现页会话…</strong>
                <p id="summary-copy">继续告诉她你的要求，她会决定下一步怎么走。</p>
                <div class="status-row">
                  <span class="status-pill phase" id="phase-pill">未连接</span>
                  <span class="status-pill" id="connection-pill">等待 session</span>
                </div>
              </section>
            </header>

            <section class="search-state">
              <div class="search-box">
                <strong id="session-strong">准备开始这一轮对话</strong>
                <p id="session-meta">默认先用当前资料进入，有需要再去设置里切换。</p>
              </div>
            </section>

            <section class="criteria-row" id="criteria-row" aria-label="已整理条件"></section>
            <section class="dialogue" id="dialogue"></section>

            <section class="followup" id="actions-panel" hidden>
              <strong>这一轮可以继续点这些</strong>
              <p id="actions-copy">点一下就行，页面会自动刷新。</p>
              <div class="suggestions" id="suggestions"></div>
            </section>

            <div class="composer">
              <div class="quick-prompts" id="quick-prompts"></div>
              <div class="composer-inner">
                <button class="icon-btn" id="new-session-btn" type="button" aria-label="新建会话">＋</button>
                <div class="input-shell">
                  <textarea
                    class="compose-field"
                    id="composer-input"
                    rows="2"
                    placeholder="告诉红娘你的偏好，她会替你整理并搜索。"
                  ></textarea>
                </div>
                <button class="send-btn" id="send-btn" type="button">发送</button>
              </div>
            </div>

            <nav class="bottom-nav" aria-label="底部导航">
              <div class="nav-item active"><strong>⌂</strong>发现</div>
              <div class="nav-item"><strong>✉</strong>聊天</div>
              <div class="nav-item"><strong>◎</strong>信任</div>
              <div class="nav-item"><strong>◌</strong>我的</div>
            </nav>
          </div>
        </section>

        <details class="debug-shell">
          <summary class="debug-summary">
            <span>联调设置</span>
            <span class="debug-hint">不重要的信息都收在这里</span>
          </summary>
          <div class="debug-content">
            <article class="config-panel">
              <p class="helper-text">默认直接连当前 gateway。只有改用户、换资料或补 token 时，才需要展开这里。</p>
              <div class="config-grid">
                <label class="field">
                  <span>API Base</span>
                  <input id="api-base-input" type="text" autocomplete="off" />
                </label>
                <label class="field">
                  <span>API Token</span>
                  <input id="api-token-input" type="password" autocomplete="off" placeholder="gateway 开了鉴权时再填" />
                </label>
                <label class="field">
                  <span>Requester ID</span>
                  <input id="requester-id-input" type="number" min="1" step="1" />
                </label>
                <label class="field">
                  <span>Profile ID</span>
                  <input id="profile-id-input" type="number" min="1" step="1" />
                </label>
              </div>
              <div class="config-actions">
                <button class="secondary" id="save-config-btn" type="button">保存配置</button>
                <button class="primary" id="restart-session-btn" type="button">重建 session</button>
                <button class="secondary" id="restore-session-btn" type="button">恢复当前</button>
                <button class="secondary" id="clear-session-btn" type="button">清空本地 session</button>
              </div>
              <div class="config-meta" id="config-meta"></div>
            </article>
          </div>
        </details>
      </div>
    </main>

    <script>
      const DEMO_CONFIG_KEY = "her.discovery.demo.config.v1";
      const DEMO_SESSION_KEY = "her.discovery.demo.session.v1";
      const QUICK_PROMPTS = [
        "我在上海，不接受抽烟，想认真恋爱。",
        "只看上海本地，最好工作稳定一点。",
        "年龄再集中一点，偏 27 到 31 岁。",
        "真人认证优先，别太会包装。",
      ];

      const refs = {
        summaryHeadline: document.getElementById("summary-headline"),
        summaryCopy: document.getElementById("summary-copy"),
        phasePill: document.getElementById("phase-pill"),
        connectionPill: document.getElementById("connection-pill"),
        sessionStrong: document.getElementById("session-strong"),
        sessionMeta: document.getElementById("session-meta"),
        criteriaRow: document.getElementById("criteria-row"),
        dialogue: document.getElementById("dialogue"),
        actionsPanel: document.getElementById("actions-panel"),
        actionsCopy: document.getElementById("actions-copy"),
        suggestions: document.getElementById("suggestions"),
        quickPrompts: document.getElementById("quick-prompts"),
        composerInput: document.getElementById("composer-input"),
        sendBtn: document.getElementById("send-btn"),
        refreshIconBtn: document.getElementById("refresh-icon-btn"),
        newSessionBtn: document.getElementById("new-session-btn"),
        apiBaseInput: document.getElementById("api-base-input"),
        apiTokenInput: document.getElementById("api-token-input"),
        requesterIdInput: document.getElementById("requester-id-input"),
        profileIdInput: document.getElementById("profile-id-input"),
        saveConfigBtn: document.getElementById("save-config-btn"),
        restartSessionBtn: document.getElementById("restart-session-btn"),
        restoreSessionBtn: document.getElementById("restore-session-btn"),
        clearSessionBtn: document.getElementById("clear-session-btn"),
        configMeta: document.getElementById("config-meta"),
      };

      const state = {
        loading: false,
        session: null,
        view: null,
        traceId: "",
        config: loadConfig(),
      };

      function inferDefaultApiBase() {
        const origin = String(window.location.origin || "").trim();
        if (origin && origin !== "null" && /^https?:\/\//.test(origin)) {
          return origin;
        }
        return "http://127.0.0.1:8765";
      }

      function safeJsonParse(raw, fallback) {
        try {
          const parsed = JSON.parse(String(raw || ""));
          return parsed && typeof parsed === "object" ? parsed : fallback;
        } catch (_error) {
          return fallback;
        }
      }

      function loadConfig() {
        const stored = safeJsonParse(localStorage.getItem(DEMO_CONFIG_KEY), {});
        const query = new URLSearchParams(window.location.search);
        return {
          apiBase: String(query.get("api_base") || stored.apiBase || inferDefaultApiBase()).trim(),
          apiToken: String(query.get("api_token") || stored.apiToken || "").trim(),
          requesterId: String(query.get("requester_id") || stored.requesterId || "70001").trim(),
          profileId: String(query.get("profile_id") || stored.profileId || "10001").trim(),
        };
      }

      function persistConfig() {
        localStorage.setItem(DEMO_CONFIG_KEY, JSON.stringify(state.config));
      }

      function getStoredSessionId() {
        const query = new URLSearchParams(window.location.search);
        const fromQuery = String(query.get("session_id") || "").trim();
        if (fromQuery) {
          localStorage.setItem(DEMO_SESSION_KEY, fromQuery);
          return fromQuery;
        }
        return String(localStorage.getItem(DEMO_SESSION_KEY) || "").trim();
      }

      function saveSessionId(sessionId) {
        const normalized = String(sessionId || "").trim();
        if (!normalized) {
          localStorage.removeItem(DEMO_SESSION_KEY);
          return;
        }
        localStorage.setItem(DEMO_SESSION_KEY, normalized);
      }

      function clearStoredSession() {
        localStorage.removeItem(DEMO_SESSION_KEY);
      }

      function syncConfigInputs() {
        refs.apiBaseInput.value = state.config.apiBase;
        refs.apiTokenInput.value = state.config.apiToken;
        refs.requesterIdInput.value = state.config.requesterId;
        refs.profileIdInput.value = state.config.profileId;
      }

      function readConfigInputs() {
        state.config = {
          apiBase: String(refs.apiBaseInput.value || inferDefaultApiBase()).trim(),
          apiToken: String(refs.apiTokenInput.value || "").trim(),
          requesterId: String(refs.requesterIdInput.value || "70001").trim(),
          profileId: String(refs.profileIdInput.value || "10001").trim(),
        };
        persistConfig();
      }

      function buildHeaders(hasBody) {
        const headers = {};
        if (hasBody) {
          headers["Content-Type"] = "application/json";
        }
        if (state.config.apiToken) {
          headers["Authorization"] = `Bearer ${state.config.apiToken}`;
        }
        return headers;
      }

      function buildApiUrl(path) {
        const base = String(state.config.apiBase || inferDefaultApiBase()).trim() || inferDefaultApiBase();
        return new URL(path, base.endsWith("/") ? base : `${base}/`).toString();
      }

      async function requestJson(method, path, body) {
        const response = await fetch(buildApiUrl(path.replace(/^\//, "")), {
          method,
          headers: buildHeaders(body !== undefined),
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        const text = await response.text();
        const payload = text ? safeJsonParse(text, {}) : {};
        if (!response.ok) {
          throw {
            status: response.status,
            code: payload.error_code || payload?.error?.code || `HTTP_${response.status}`,
            message:
              payload.error_message ||
              payload?.error?.message ||
              `请求失败（${response.status}）`,
            retryable: Boolean(payload.retryable),
            traceId: String(payload.trace_id || "").trim(),
          };
        }
        return payload;
      }

      function phaseLabel(phase) {
        const mapping = {
          collecting_preferences: "正在整理偏好",
          searching: "正在搜索",
          results_shown: "已展示结果",
          no_result: "暂无合适结果",
        };
        return mapping[String(phase || "").trim()] || "等待后端决策";
      }

      function escapeHtml(text) {
        return String(text || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function detailPageHref(profileId) {
        const params = new URLSearchParams();
        params.set("profile_id", String(profileId));
        const sessionId = String((state.session || {}).session_id || getStoredSessionId() || "").trim();
        if (sessionId) {
          params.set("session_id", sessionId);
        }
        if (window.location.origin === "null" && state.config.apiBase) {
          params.set("api_base", state.config.apiBase);
        }
        const path = window.location.pathname.includes("/demo/discovery")
          ? "/demo/discovery/profile-detail"
          : "./profile-detail.html";
        return `${path}?${params.toString()}`;
      }

      function syncLocationFromState() {
        const params = new URLSearchParams(window.location.search);
        params.set("requester_id", state.config.requesterId);
        params.set("profile_id", state.config.profileId);
        const sessionId = String((state.session || {}).session_id || getStoredSessionId() || "").trim();
        if (sessionId) {
          params.set("session_id", sessionId);
        } else {
          params.delete("session_id");
        }
        if (window.location.origin === "null" && state.config.apiBase) {
          params.set("api_base", state.config.apiBase);
        }
        const next = `${window.location.pathname}?${params.toString()}`;
        history.replaceState(null, "", next);
      }

      function renderCriteriaChips() {
        const chips = Array.isArray((state.view || {}).criteria_chips) ? state.view.criteria_chips : [];
        refs.criteriaRow.innerHTML = "";
        if (!chips.length) {
          refs.criteriaRow.innerHTML = '<span class="criteria-chip empty">这一轮还没有整理出可展示条件</span>';
          return;
        }
        for (const chip of chips) {
          const span = document.createElement("span");
          span.className = "criteria-chip active";
          span.textContent = String(chip.label || "");
          refs.criteriaRow.appendChild(span);
        }
      }

      function renderSuggestedActions() {
        const actions = Array.isArray((state.view || {}).suggested_actions) ? state.view.suggested_actions : [];
        refs.suggestions.innerHTML = "";
        refs.actionsPanel.hidden = actions.length === 0;
        if (!actions.length) {
          return;
        }
        refs.actionsCopy.textContent = "点击时前端只回传 action_id，后端会返回新的完整 view。";
        for (const action of actions) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "suggestion-chip";
          button.dataset.actionId = String(action.action_id || "");
          button.textContent = String(action.label || "继续");
          button.disabled = state.loading;
          refs.suggestions.appendChild(button);
        }
      }

      function buildResultCard(candidate) {
        const article = document.createElement("article");
        article.className = "result-card";
        const trustBadges = Array.isArray(candidate.trust_badges) ? candidate.trust_badges.slice(0, 2) : [];
        const matchScore = candidate.match_score ?? "--";
        const cover = document.createElement("div");
        cover.className = "result-cover";
        if (candidate.cover_image_url) {
          cover.style.backgroundImage =
            `linear-gradient(145deg, rgba(20, 38, 34, 0.68), rgba(92, 134, 123, 0.34), rgba(204, 157, 125, 0.5)), url("${String(candidate.cover_image_url).replaceAll('"', "&quot;")}")`;
        }
        cover.innerHTML = `
          <div class="result-top">
            <span class="meta-pill">${escapeHtml(trustBadges.join(" · ") || "待继续确认")}</span>
            <div class="score">
              <small>匹配感</small>
              <strong>${escapeHtml(matchScore)}</strong>
            </div>
          </div>
          <div class="result-bottom">
            <span class="meta-pill">profile_id ${escapeHtml(candidate.profile_id)}</span>
          </div>
        `;
        const body = document.createElement("div");
        body.className = "result-body";

        const tags = [];
        for (const badge of trustBadges) {
          tags.push(`<span class="tag good">${escapeHtml(badge)}</span>`);
        }
        if (!tags.length) {
          tags.push('<span class="tag soft">信任字段待继续确认</span>');
        }
        if (candidate.subtitle) {
          tags.push(`<span class="tag soft">${escapeHtml(candidate.subtitle)}</span>`);
        }

        body.innerHTML = `
          <div class="person-row">
            <div>
              <h2>${escapeHtml(candidate.title || "未命名候选人")}</h2>
              <p>${escapeHtml(candidate.subtitle || "后端暂未返回更多稳定字段")}</p>
            </div>
          </div>
          <div class="tag-row">${tags.join("")}</div>
          <div class="module">
            <p class="module-title">红娘给出的当前理由</p>
            <p>${escapeHtml(candidate.reason_summary || "这一轮先看整体资料。")}</p>
          </div>
          <div class="card-actions">
            <button class="btn secondary" type="button" data-open-profile="${escapeHtml(candidate.profile_id)}">看详情</button>
            <button class="btn primary" type="button" data-seed-message="${escapeHtml(candidate.title || "")} 这类再多看一点">围绕这类继续聊</button>
          </div>
        `;

        article.appendChild(cover);
        article.appendChild(body);
        return article;
      }

      function renderTimeline() {
        const timeline = Array.isArray((state.view || {}).timeline) ? state.view.timeline : [];
        refs.dialogue.innerHTML = "";
        if (!timeline.length) {
          refs.dialogue.innerHTML = '<div class="empty-state">当前还没有 timeline。创建 session 后，这里会直接显示后端返回的首屏 view。</div>';
          return;
        }
        for (const item of timeline) {
          const type = String(item.item_type || "").trim();
          if (type === "assistant_message" || type === "user_message") {
            const wrapper = document.createElement("div");
            wrapper.className = `msg ${type === "user_message" ? "user" : "assistant"}`;
            if (type === "assistant_message") {
              const avatar = document.createElement("div");
              avatar.className = "user-avatar";
              avatar.textContent = "C";
              wrapper.appendChild(avatar);
            }
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerHTML = `
              <strong>${type === "user_message" ? "我" : "AI 红娘"}</strong>
              <p>${escapeHtml(item.body || "")}</p>
            `;
            wrapper.appendChild(bubble);
            refs.dialogue.appendChild(wrapper);
            continue;
          }
          if (type === "result_group") {
            const section = document.createElement("section");
            section.innerHTML = `<p class="result-group-title">${escapeHtml(item.title || "这一轮结果")}</p>`;
            const stack = document.createElement("div");
            stack.className = "result-stack";
            for (const card of Array.isArray(item.cards) ? item.cards : []) {
              stack.appendChild(buildResultCard(card));
            }
            if (!stack.children.length) {
              stack.innerHTML = '<div class="empty-state">这一轮后端没有返回可展示候选卡片。</div>';
            }
            section.appendChild(stack);
            refs.dialogue.appendChild(section);
            continue;
          }
          const fallback = document.createElement("div");
          fallback.className = "inline-note";
          fallback.innerHTML = `<strong>未识别的 timeline item</strong><p>${escapeHtml(JSON.stringify(item))}</p>`;
          refs.dialogue.appendChild(fallback);
        }
      }

      function renderQuickPrompts() {
        refs.quickPrompts.innerHTML = "";
        for (const prompt of QUICK_PROMPTS) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "quick-pill";
          button.textContent = prompt;
          button.disabled = state.loading;
          button.dataset.quickPrompt = prompt;
          refs.quickPrompts.appendChild(button);
        }
      }

      function renderMeta() {
        const sessionId = String((state.session || {}).session_id || "").trim();
        const phase = String((state.session || {}).phase || "").trim();
        refs.summaryHeadline.textContent = sessionId
          ? "红娘已经接上了，继续补充你的要求就行。"
          : "正在准备这一轮会话。";
        refs.summaryCopy.textContent = sessionId
          ? "她会自己决定是继续追问、帮你筛人，还是给你下一步动作。"
          : "如果恢复不到历史会话，页面会自动新建一轮。";
        refs.phasePill.textContent = phaseLabel(phase);
        refs.connectionPill.textContent = state.loading ? "请求中…" : sessionId ? "已连接" : "等待连接";
        refs.connectionPill.className = `status-pill${state.loading ? "" : ""}`;
        refs.sessionStrong.textContent = sessionId
          ? "红娘已经接到你的资料"
          : "准备开始这一轮对话";
        refs.sessionMeta.textContent = sessionId
          ? "直接补充年龄、城市、关系期待或不能接受的点就行。"
          : "如果要切用户或切资料，可以去下面的联调设置里改。";
        refs.configMeta.innerHTML = `
          <div><strong>当前 API Base：</strong> <code>${escapeHtml(state.config.apiBase)}</code></div>
          <div><strong>当前用户：</strong> <code>${escapeHtml(state.config.requesterId)}</code></div>
          <div><strong>当前资料：</strong> <code>${escapeHtml(state.config.profileId)}</code></div>
          <div><strong>当前 Session：</strong> <code>${escapeHtml(sessionId || "-")}</code></div>
          <div><strong>当前 Trace：</strong> <code>${escapeHtml(state.traceId || "-")}</code></div>
        `;
      }

      function applyViewPayload(payload) {
        state.traceId = String(payload.trace_id || "").trim();
        state.session = payload.session || null;
        state.view = payload.view || null;
        const nextSessionId = String(((payload || {}).session || {}).session_id || "").trim();
        saveSessionId(nextSessionId);
        syncLocationFromState();
        render();
      }

      function render() {
        renderMeta();
        renderCriteriaChips();
        renderTimeline();
        renderSuggestedActions();
        renderQuickPrompts();
        const composer = (state.view || {}).composer || {};
        refs.composerInput.placeholder = String(composer.placeholder || "继续告诉红娘你的要求");
        refs.composerInput.disabled = Boolean(composer.disabled) || state.loading;
        refs.sendBtn.disabled = Boolean(composer.disabled) || state.loading || !String(refs.composerInput.value || "").trim();
        refs.newSessionBtn.disabled = state.loading;
        refs.refreshIconBtn.disabled = state.loading;
        refs.restoreSessionBtn.disabled = state.loading;
        refs.restartSessionBtn.disabled = state.loading;
      }

      async function createSession() {
        readConfigInputs();
        state.loading = true;
        render();
        try {
          const payload = await requestJson("POST", "/v1/discovery/sessions", {
            requester_id: Number(state.config.requesterId),
            profile_id: Number(state.config.profileId),
          });
          applyViewPayload(payload);
        } catch (error) {
          refs.dialogue.innerHTML = `<div class="empty-state">创建 session 失败：${escapeHtml(error.message || "未知错误")}</div>`;
          state.traceId = String(error.traceId || "").trim();
          state.session = null;
          state.view = null;
          renderMeta();
        } finally {
          state.loading = false;
          render();
        }
      }

      async function restoreSession(options = {}) {
        readConfigInputs();
        const sessionId = String(options.sessionId || getStoredSessionId() || "").trim();
        if (!sessionId) {
          await createSession();
          return;
        }
        state.loading = true;
        render();
        try {
          const payload = await requestJson("GET", `/v1/discovery/sessions/${encodeURIComponent(sessionId)}`);
          applyViewPayload(payload);
        } catch (error) {
          if (error.code === "DISCOVERY_SESSION_NOT_FOUND" || error.code === "DISCOVERY_SESSION_CLOSED") {
            clearStoredSession();
            await createSession();
            return;
          }
          refs.dialogue.innerHTML = `<div class="empty-state">恢复 session 失败：${escapeHtml(error.message || "未知错误")}</div>`;
          state.traceId = String(error.traceId || "").trim();
          renderMeta();
        } finally {
          state.loading = false;
          render();
        }
      }

      async function submitTurn(payload) {
        const sessionId = String(((state.session || {}).session_id || getStoredSessionId()) || "").trim();
        if (!sessionId) {
          await createSession();
          return;
        }
        state.loading = true;
        render();
        try {
          const next = await requestJson(
            "POST",
            `/v1/discovery/sessions/${encodeURIComponent(sessionId)}/turns`,
            payload,
          );
          applyViewPayload(next);
          refs.composerInput.value = "";
        } catch (error) {
          refs.dialogue.insertAdjacentHTML(
            "afterbegin",
            `<div class="inline-note"><strong>请求失败</strong><p>${escapeHtml(error.message || "未知错误")}</p></div>`,
          );
          state.traceId = String(error.traceId || "").trim();
          renderMeta();
        } finally {
          state.loading = false;
          render();
        }
      }

      function openProfile(profileId) {
        window.location.href = detailPageHref(profileId);
      }

      function attachEvents() {
        refs.sendBtn.addEventListener("click", () => {
          const message = String(refs.composerInput.value || "").trim();
          if (!message) {
            return;
          }
          submitTurn({ user_message: message });
        });

        refs.composerInput.addEventListener("input", () => {
          refs.sendBtn.disabled = state.loading || !String(refs.composerInput.value || "").trim();
        });

        refs.composerInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            refs.sendBtn.click();
          }
        });

        refs.quickPrompts.addEventListener("click", (event) => {
          const target = event.target.closest("[data-quick-prompt]");
          if (!target) {
            return;
          }
          submitTurn({ user_message: target.dataset.quickPrompt });
        });

        refs.suggestions.addEventListener("click", (event) => {
          const target = event.target.closest("[data-action-id]");
          if (!target) {
            return;
          }
          submitTurn({ action_id: target.dataset.actionId });
        });

        refs.dialogue.addEventListener("click", (event) => {
          const openButton = event.target.closest("[data-open-profile]");
          if (openButton) {
            openProfile(openButton.dataset.openProfile);
            return;
          }
          const seedButton = event.target.closest("[data-seed-message]");
          if (seedButton) {
            refs.composerInput.value = seedButton.dataset.seedMessage || "";
            refs.composerInput.focus();
            refs.sendBtn.disabled = !String(refs.composerInput.value || "").trim();
          }
        });

        refs.refreshIconBtn.addEventListener("click", () => restoreSession());
        refs.newSessionBtn.addEventListener("click", () => {
          clearStoredSession();
          createSession();
        });
        refs.saveConfigBtn.addEventListener("click", () => {
          readConfigInputs();
          syncLocationFromState();
          render();
        });
        refs.restoreSessionBtn.addEventListener("click", () => restoreSession());
        refs.restartSessionBtn.addEventListener("click", () => {
          clearStoredSession();
          createSession();
        });
        refs.clearSessionBtn.addEventListener("click", () => {
          clearStoredSession();
          state.session = null;
          state.view = null;
          state.traceId = "";
          syncLocationFromState();
          render();
          refs.dialogue.innerHTML = '<div class="empty-state">本地 session_id 已清空。点击“重建 session”或顶部“＋”重新开始。</div>';
        });
      }

      async function bootstrap() {
        syncConfigInputs();
        attachEvents();
        render();
        const query = new URLSearchParams(window.location.search);
        if (query.get("reset") === "1") {
          clearStoredSession();
        }
        if (getStoredSessionId()) {
          await restoreSession();
          return;
        }
        await createSession();
      }

      bootstrap();
    </script>
  </body>
</html>
