<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · 通知中心</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="notifications">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Companion Page / Notice</p>
          <h1 class="lede">通知中心</h1>
          <p>通知中心承接推荐、信任、聊天和系统事件，统一把“需要你处理”的事情提到一处。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <h2>通知中心</h2>
            <span class="chip active">3 条未读</span>
          </header>
          <div class="phone-scroll">
            <section class="card">
              <div class="timeline">
                <div class="timeline-item"><strong>需要完成身份核验</strong><span>请在 3 天内上传证件</span></div>
                <div class="timeline-item"><strong>今日有新推荐</strong><span>陈雅婷已加入推荐列表</span></div>
                <div class="timeline-item"><strong>安全提醒</strong><span>检测到当前对话存在投资相关风险</span></div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
