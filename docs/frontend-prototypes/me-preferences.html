<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · 偏好设置</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="me-preferences">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Companion Page / Preferences</p>
          <h1 class="lede">偏好设置</h1>
          <p>偏好页复用搜索页的字段体系，但这里是长期保存的“默认择偶条件”，供发现和推荐中心直接消费。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <a class="icon-btn" href="/demo/me">←</a>
            <h2>偏好设置</h2>
            <button class="icon-btn" type="button" aria-label="保存偏好设置">保存</button>
          </header>
          <div class="phone-scroll">
            <section class="card">
              <div class="filter-list">
                <div class="filter-row"><strong>目标城市</strong><span>北京 / 上海</span></div>
                <div class="filter-row"><strong>年龄范围</strong><span>27-33</span></div>
                <div class="filter-row"><strong>学历</strong><span>本科及以上</span></div>
                <div class="filter-row"><strong>婚姻状况</strong><span>未婚优先</span></div>
                <div class="filter-row"><strong>核验等级</strong><span>≥ 2</span></div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
