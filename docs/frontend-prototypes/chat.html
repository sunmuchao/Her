<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · 聊天</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="chat">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Sketch 05 / Chat</p>
          <h1 class="lede">聊天页</h1>
          <p>聊天页以关系推进为主，但顶部保留 thread 和安全提醒，底部把摘要、风险、举报、反馈做成快捷动作，便于把聊天和信任能力接起来。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <div class="nav-left">
              <a class="icon-btn" href="/demo/discovery/profile-detail">←</a>
              <div class="avatar"><img src="/demo/assets/sketch/chat-avatar.png" alt="李晓雨头像" /></div>
              <div class="nav-copy">
                <h2>李晓雨</h2>
                <small>聊天已建立 · 安全守护中</small>
              </div>
            </div>
            <div class="nav-actions">
              <button class="icon-btn" type="button" aria-label="发起语音通话">☎</button>
              <button class="icon-btn" type="button" aria-label="查看更多聊天操作">⋯</button>
            </div>
          </header>
          <div class="phone-scroll">
            <section class="notice warn" role="status">安全提醒：如对方提及投资、借款或站外转账，请提高警惕。</section>

            <section class="message-list">
              <div class="message">
                <div class="bubble">
                  <p>你好，我看了你的资料，发现我们都在做产品相关工作。</p>
                  <p class="subtle" style="margin-top: 8px">10:20</p>
                </div>
              </div>
              <div class="message user">
                <div class="bubble user">
                  <p>是吗，那很巧，很高兴认识你。</p>
                  <p class="subtle" style="margin-top: 8px; color: rgba(255,255,255,0.72)">10:22</p>
                </div>
              </div>
              <div class="message">
                <div class="bubble">
                  <p>这周末要不要视频聊一会儿，先多了解一下彼此？</p>
                  <p class="subtle" style="margin-top: 8px">10:31</p>
                </div>
              </div>
              <div class="message">
                <div class="bubble photo">
                  <img src="/demo/assets/sketch/chat-photo-card.png" alt="聊天中分享的资料卡" />
                </div>
              </div>
            </section>

            <div class="bottom-tabs five">
              <button class="tab-item active" type="button" aria-current="page">概要</button>
              <a class="tab-item" href="/demo/chat/risk-sidebar">风险</a>
              <a class="tab-item" href="/demo/chat/report">举报</a>
              <a class="tab-item" href="/demo/chat/meeting-feedback">见面反馈</a>
              <button class="tab-item" type="button">通话</button>
            </div>

            <div class="composer">
              <input type="text" placeholder="输入你想说的话" aria-label="聊天输入框" />
              <button class="send-btn" type="button" aria-label="发送消息">发</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
