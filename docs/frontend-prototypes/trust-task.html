<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · 核验任务</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="trust-task">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Trust Companion / Task</p>
          <h1 class="lede">核验任务详情</h1>
          <p>这个页面把信任中心里的单个核验任务展开，让用户明确知道触发原因、材料要求、预计处理时间以及可替代的验证路径。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <a class="icon-btn" href="/demo/trust">←</a>
            <h2>核验任务</h2>
            <span class="chip warn">待补材料</span>
          </header>
          <div class="phone-scroll">
            <section class="card">
              <strong>身份核验</strong>
              <p class="subtle mt-6">预计 2 个工作日完成人工复核</p>
              <div class="notice warn mt-12">
                请上传身份证正反面。补齐材料后，系统会继续审核并同步进度。
              </div>
            </section>

            <section class="card">
              <h3 class="section-title">所需材料</h3>
              <div class="detail-list mt-12">
                <div class="detail-item"><strong>身份证正面</strong><span class="chip blue">待上传</span></div>
                <div class="detail-item"><strong>身份证反面</strong><span class="chip blue">待上传</span></div>
                <div class="detail-item"><strong>近期自拍照</strong><span class="chip good">可选</span></div>
              </div>
            </section>

            <section class="card">
              <h3 class="section-title">替代路径</h3>
              <p class="mt-8">如果你想先提升可信度，可以在等待人工审核时同步完成活体验证。</p>
              <div class="button-row mt-12">
                <button class="btn" type="button">上传材料</button>
                <a class="btn secondary" href="/demo/live-video-verification">去做活体验证</a>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
