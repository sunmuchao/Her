<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · Me History</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="me-history">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Companion Page / History</p>
          <h1 class="lede">互动历史</h1>
          <p>历史页用于汇总打招呼、聊天、见面反馈和核验动作，帮助用户回看自己的关系推进轨迹。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <a class="icon-btn" href="/demo/me">←</a>
            <h2>History</h2>
            <span class="chip blue">最近 30 天</span>
          </header>
          <div class="phone-scroll">
            <section class="card">
              <div class="timeline">
                <div class="timeline-item"><strong>01-02 10:31</strong><span>与李晓雨开始聊天</span></div>
                <div class="timeline-item"><strong>01-02 14:10</strong><span>保存搜索条件“北京本科 28-34”</span></div>
                <div class="timeline-item"><strong>01-03 09:20</strong><span>收到推荐卡片 CD_002A</span></div>
                <div class="timeline-item"><strong>01-04 18:30</strong><span>提交见面反馈</span></div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
