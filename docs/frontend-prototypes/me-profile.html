<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · Me Profile</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="me-profile">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Companion Page / Profile</p>
          <h1 class="lede">我的资料</h1>
          <p>资料页作为搜索和推荐的上游输入，这里用轻量结构展示已填写项、待补充项和核验状态。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <a class="icon-btn" href="/demo/me">←</a>
            <h2>My Profile</h2>
            <span class="chip active">82%</span>
          </header>
          <div class="phone-scroll">
            <section class="card">
              <div class="kv-grid">
                <div class="kv"><span>昵称</span><strong>Sun</strong></div>
                <div class="kv"><span>城市</span><strong>上海</strong></div>
                <div class="kv"><span>年龄</span><strong>29</strong></div>
                <div class="kv"><span>目标</span><strong>认真结婚</strong></div>
              </div>
            </section>
            <section class="card">
              <h3 class="section-title">待补充</h3>
              <div class="detail-list" style="margin-top: 12px">
                <div class="detail-item"><strong>职业详情</strong><span class="chip warn">缺失</span></div>
                <div class="detail-item"><strong>收入区间</strong><span class="chip warn">缺失</span></div>
                <div class="detail-item"><strong>生活照片</strong><span class="chip blue">建议上传</span></div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
