<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · 我的</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="me">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Companion Page / Me</p>
          <h1 class="lede">我的</h1>
          <p>这个页面不是 Sketch 主画板的一部分，但为了补齐 demo 路由，我沿用同一视觉体系整理了账户概览、资料入口、偏好设置和历史记录。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <h2>我的主页</h2>
            <button class="icon-btn" type="button" aria-label="打开设置">设置</button>
          </header>
          <div class="phone-scroll">
            <section class="card">
              <div class="title-row">
                <div>
                  <h3>Sun</h3>
                  <p class="subtle">资料完整度 82%</p>
                </div>
                <span class="chip good">信任分 +2</span>
              </div>
            </section>
            <div class="info-list">
              <a class="detail-item" href="/demo/me/profile"><strong>我的资料</strong><span>编辑</span></a>
              <a class="detail-item" href="/demo/me/preferences"><strong>偏好设置</strong><span>筛选条件</span></a>
              <a class="detail-item" href="/demo/me/history"><strong>历史记录</strong><span>最近互动</span></a>
              <a class="detail-item" href="/demo/notifications"><strong>通知中心</strong><span>3 条未读</span></a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
