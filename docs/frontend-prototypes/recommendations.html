<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Her · 推荐中心</title>
    <link rel="stylesheet" href="/demo/assets/her-demo/styles.css" />
  </head>
  <body data-demo-page="recommendations">
    <main class="proto-page">
      <aside class="copy-panel">
        <section class="surface">
          <p class="eyebrow">Sketch 04 / Recommendations</p>
          <h1 class="lede">推荐中心</h1>
          <p>这一页承接“持续留意”的产品能力，分成推荐卡片、推荐记录、搜索历史和持续监听。它不是聊天，也不是纯搜索，而是用户的推荐资产看板。</p>
        </section>
      </aside>

      <section class="phone-shell">
        <div class="phone-screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons"><span>5G</span><span>100%</span></div>
          </div>
          <header class="nav-bar">
            <h2>我的推荐中心</h2>
            <button class="icon-btn" type="button" aria-label="管理推荐设置">管理</button>
          </header>
          <div class="phone-scroll">
            <div class="bottom-tabs four">
              <button class="tab-item active" type="button" aria-current="page">推荐卡片</button>
              <button class="tab-item" type="button">持续留意</button>
              <button class="tab-item" type="button">推荐记录</button>
              <button class="tab-item" type="button">搜索历史</button>
            </div>

            <section class="card candidate-card">
              <div class="wide-photo">
                <img
                  src="/demo/assets/sketch/recommendation-hero.png"
                  alt="今日推荐陈雅婷"
                  loading="eager"
                  decoding="sync"
                  fetchpriority="high"
                />
              </div>
              <div class="title-row">
                <div>
                  <h3>今日为你推荐：陈雅婷</h3>
                  <p class="subtle">27岁 · 北京 · 互联网 · 硕士</p>
                </div>
                <span class="chip warn">未读</span>
              </div>
              <div class="badge-row">
                <span class="chip good">匹配度 94%</span>
                <span class="chip active">核验 Lv.3</span>
                <span class="chip">今日新推荐</span>
              </div>
              <div class="button-row">
                <a class="btn" href="/demo/chat">打招呼</a>
                <a class="btn secondary" href="/demo/discovery/profile-detail">看详情</a>
              </div>
            </section>

            <section class="card">
              <div class="title-row">
                <h3>持续留意</h3>
                <span class="chip good">监听中</span>
              </div>
              <p class="subtle" style="margin-top: 8px">北京女性 25-32岁 核验≥2</p>
              <div class="notice" style="margin-top: 12px">
                每日最多推送 3 位新候选 · 夜间 22:00-08:00 不主动打扰
              </div>
              <p class="subtle" style="margin-top: 12px">上次刷新: 2024-01-02 09:15 · 发现 5 位候选</p>
              <div class="button-row three" style="margin-top: 12px">
                <button class="btn secondary" type="button">立即刷新</button>
                <button class="btn secondary" type="button">修改条件</button>
                <button class="btn ghost" type="button">暂停</button>
              </div>
            </section>

            <button class="btn" type="button">新建持续留意</button>

            <div class="bottom-tabs">
              <a class="tab-item" href="/demo/search">搜索</a>
              <a class="tab-item" href="/demo/discovery">发现</a>
              <button class="tab-item active" type="button" aria-current="page">推荐</button>
              <a class="tab-item" href="/demo/trust">信任</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
