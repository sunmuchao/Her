[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "her"
version = "0.1.0"
description = "Relationship-operations prototype: search, persona memory, recommendation, and matchmaking."
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9.0",
  "apscheduler>=3.10,<4",
  "edge-tts>=6.1.0",
  "openai>=1.0.0",
  "openai-agents",
  "requests>=2.0.0,<3.0.0",  # 明确指定 requests 版本范围（解决依赖冲突）
  "minio>=7.2.0",
  "pydantic>=2.0.0",
  "pymysql>=1.0.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "gunicorn>=21.0.0",  # 生产级WSGI服务器
  "gevent>=23.0.0",  # 异步worker，提升并发性能
  "prometheus-client>=0.17.0",  # Prometheus指标导出
  "pydub>=0.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "setuptools>=61.2",
]
opencv = [
  "opencv-python-headless>=4.8.0",
  "numpy>=1.26.0",
]
local_oss = [
  "opencv-python-headless>=4.8.0",
  "numpy>=1.26.0",
  "torch>=2.1.0",
  "pymilvus>=2.3.0",  # Milvus向量数据库客户端（用于照片外貌描述向量入库）
  "milvus-lite>=2.3.0",  # Milvus Lite 本地数据库支持（用于向量入库）
]

[project.scripts]
partner-search = "partner_search.search_candidates:main"
persona-memory-sync = "persona_memory_sync.cli:main"

[tool.setuptools.packages.find]
where = [
  ".",
  "external-systems/partner-recommendation-system",
  "external-systems/partner-matchmaking-system",
  "external-systems/partner-chat-system",
  "external-systems/partner-discovery-system",
  "external-systems/partner-http-gateway",
  "external-systems/sse-server",
]
include = [
  "db_migrations*",
  "async_jobs*",
  "match_domain*",
  "task_scheduler*",
  "observability*",
  "partner_search*",
  "persona_memory_sync*",
  "profile_service*",
  "recommendation_system*",
  "matchmaking_system*",
  "chat_system*",
  "discovery_system*",
  "gateway*",
  "sse_server*",
]

[tool.setuptools]
py-modules = [
  "her_external_systems",
  "generate_virtual_profiles",
  "her_activate_repo",
  "her_env",
  "her_json_utils",
  "her_monorepo_bootstrap",
  "her_repo_path_bootstrap",
  "her_runtime_context",
  "her_time_utils",
  "mysql_source_config",
  "outer_mysql_compat",
  "outer_system_mysql_schema",
  "partner_moderation",
  "profile_detail_reader",
  "profile_source_refs",
]

[tool.ruff]
exclude = [
  "build",
  "tmp",
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".codex",
]

[tool.ruff.lint.per-file-ignores]
# Intentionally adjust sys.path before later imports.
"external-systems/partner-recommendation-system/recommendation_system/storage.py" = ["E402"]
"external-systems/partner-recommendation-system/recommendation_system/service.py" = ["E402"]
"external-systems/partner-recommendation-system/recommendation_system/proxy_intro.py" = ["E402"]
"external-systems/partner-matchmaking-system/matchmaking_system/storage.py" = ["E402"]
"external-systems/partner-matchmaking-system/matchmaking_system/service.py" = ["E402"]
"external-systems/partner-chat-system/chat_system/storage.py" = ["E402"]
"external-systems/partner-chat-system/chat_system/service.py" = ["E402"]
"external-systems/partner-chat-system/chat_system/events.py" = ["E402"]
"external-systems/partner-chat-system/chat_system/__init__.py" = ["E402"]
"external-systems/partner-http-gateway/gateway/__main__.py" = ["E402"]
"local-skills/persona-memory-sync/scripts/ensure_persona_tables.py" = ["E402"]
"local-skills/persona-memory-sync/scripts/render_public_profile.py" = ["E402"]
"local-skills/persona-memory-sync/scripts/sync_persona_to_profile.py" = ["E402"]
"local-skills/persona-memory-sync/scripts/upsert_persona_memory.py" = ["E402"]
"local-skills/persona-memory-sync/tests/test_persona_memory_audit.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
  "opencv: tests that require optional opencv-python-headless dependency",
]
